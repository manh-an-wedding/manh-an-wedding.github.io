name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: node --test scripts/share-preview.test.mjs
      - run: npx ng build --base-href /
      # Emit localized metadata, direct SPA route documents, and the fallback.
      - name: Static route documents
        run: node scripts/create-static-routes.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/manhan-web/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

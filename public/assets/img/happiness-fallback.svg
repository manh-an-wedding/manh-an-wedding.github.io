<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2561" role="img" aria-labelledby="title description">
  <title id="title">Song hỷ</title>
  <desc id="description">Ảnh dự phòng trang trí bằng chữ song hỷ màu vàng trên nền kem.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f8efe2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#9e1b1b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1440" height="2561" fill="url(#background)"/>
  <rect x="54" y="54" width="1332" height="2453" rx="24" fill="none" stroke="#c9a24b" stroke-width="3"/>
  <g fill="#c9a24b" opacity=".34" font-family="serif" text-anchor="middle">
    <text x="190" y="260" font-size="86">囍</text>
    <text x="1250" y="500" font-size="62">囍</text>
    <text x="210" y="2050" font-size="68">囍</text>
    <text x="1210" y="2280" font-size="92">囍</text>
  </g>
  <g filter="url(#shadow)" text-anchor="middle">
    <text x="720" y="1325" fill="#c9a24b" font-family="serif" font-size="560" font-weight="700">囍</text>
    <text x="720" y="1530" fill="#9e1b1b" font-family="Georgia, serif" font-size="76" font-style="italic">Mạnh &amp; An</text>
  </g>
</svg>
